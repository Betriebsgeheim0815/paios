name: PAIOS Agent Boundary
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  protected-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Reject protected data changes
        shell: bash
        run: |
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if printf '%s\n' "$files" | grep -Eq '^(reference-vault/|\.hermes/|\.env$|.*\.(pem|key)$)'; then
            echo "Protected paths changed."
            exit 1
          fi
          echo "Protected business data and credentials unchanged."
